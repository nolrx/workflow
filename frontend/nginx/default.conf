# AI Creative Studio — frontend (nginx) + API reverse proxy
# Domain: worksflow.xyz

upstream backend_api {
    server backend:5001;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name worksflow.xyz www.worksflow.xyz _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend's MAX_CONTENT_LENGTH is 50MB — allow matching upload bodies.
    client_max_body_size 50m;

    # gzip for static assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml font/woff2;

    # --- Figma plugin pull endpoint (null-origin sandbox) --------------------
    # The Figma plugin UI runs in a null-origin sandboxed iframe, so the app's
    # CORS allowlist (worksflow.xyz) never matches it. The backend only sets a
    # wildcard ACAO on the success path — error responses (invalid / expired /
    # consumed pairing code) fall back to the flask-cors allowlist, which the
    # browser then blocks, surfacing a real "配对码已失效" as an opaque
    # "Failed to fetch". This endpoint is already gated by a single-use,
    # short-lived pairing code (the code IS the credential), so normalize CORS
    # to a clean wildcard for every status code and proxy straight to backend.
    location = /api/code/figma/pull {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Drop whatever ACAO the app/flask-cors set and force a single wildcard
        # so the sandboxed plugin can read both success and error responses.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # --- API reverse proxy ---------------------------------------------------
    # Preserves the /api prefix (proxy_pass has no path component). Buffering is
    # disabled so the Agent Swarm SSE streams (/api/agent/runs/<id>/stream)
    # flush token-by-token instead of being held back by nginx.
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / streaming friendliness
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Backend health passthrough (handy for external probes)
    location = /health {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- SPA -----------------------------------------------------------------
    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History-mode routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
