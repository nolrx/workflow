[project]
name = "ai-creative-studio"
version = "1.0.0"
description = "AI-powered creative platform combining PPT generation and social media content creation"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-jwt-extended>=4.6.0",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
    "werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "stripe>=7.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pillow>=10.0.0",
    "tenacity>=8.0.0",
    "google-generativeai>=0.8.0",
    "google-genai>=1.58.0",
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: hits live AI APIs (Claude / Panlaxy); requires API keys and network",
]
