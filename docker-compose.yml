services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-creative-studio-postgres
    environment:
      POSTGRES_USER: ai_studio
      POSTGRES_PASSWORD: ai_studio_dev_2024
      POSTGRES_DB: ai_creative_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_studio -d ai_creative_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-creative-studio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
