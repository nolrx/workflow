# AI Creative Studio — frontend (nginx) + API reverse proxy
# Domain: worksflow.xyz

upstream backend_api {
    server backend:5001;
}

# WebSocket upgrade plumbing for the deployed-app ws proxy below. A normal HTTP
# request has no Upgrade header → $connection_upgrade is "close"; a ws handshake
# carries "Upgrade: websocket" → it becomes "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name worksflow.xyz www.worksflow.xyz _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend's MAX_CONTENT_LENGTH is 50MB — allow matching upload bodies.
    client_max_body_size 50m;

    # Docker's embedded DNS — lets the ws proxy below resolve a deployed app's
    # container name (app-<pid>) at request time via a variable proxy_pass.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # gzip for static assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml font/woff2;

    # --- Figma plugin pull endpoint (null-origin sandbox) --------------------
    # The Figma plugin UI runs in a null-origin sandboxed iframe, so the app's
    # CORS allowlist (worksflow.xyz) never matches it. The backend only sets a
    # wildcard ACAO on the success path — error responses (invalid / expired /
    # consumed pairing code) fall back to the flask-cors allowlist, which the
    # browser then blocks, surfacing a real "配对码已失效" as an opaque
    # "Failed to fetch". This endpoint is already gated by a single-use,
    # short-lived pairing code (the code IS the credential), so normalize CORS
    # to a clean wildcard for every status code and proxy straight to backend.
    location = /api/code/figma/pull {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Drop whatever ACAO the app/flask-cors set and force a single wildcard
        # so the sandboxed plugin can read both success and error responses.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # --- API reverse proxy ---------------------------------------------------
    # Preserves the /api prefix (proxy_pass has no path component). Buffering is
    # disabled so the Agent Swarm SSE streams (/api/agent/runs/<id>/stream)
    # flush token-by-token instead of being held back by nginx.
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / streaming friendliness
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- Deployed frontend-project preview (session-bound) -------------------
    # Each Code session's built frontend project is also served directly under
    # /preview/<project_id>/ so it can be opened in a real browser tab (full-page,
    # native) instead of only the sandboxed iframe inside the chat. The backend
    # resolves <project_id> to that project's latest built run and streams its
    # dist; auth rides a one-shot ?token= on the entry request, which the backend
    # pins into a path-scoped cookie (and redirects to a token-less URL) so the
    # dist's relative asset requests stay authenticated. Mounted top-level (not
    # under /api) to keep the URL deploy-like.
    location /preview/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- Deployed backend reverse proxy + WebSocket (full-stack) -------------
    # The served frontend (/preview/<pid>/) calls its deployed backend over a
    # single base, /app/<pid>/api/... (HTTP and ws alike). A regex location (wins
    # over a bare /app/ prefix) captures the sub-path so the ws branch can strip
    # it. Normal HTTP flows to the platform Flask reverse proxy unchanged. A
    # request carrying `Upgrade:` is split off to @app_ws (the Flask `requests`
    # proxy CANNOT upgrade a connection) and proxied DIRECTLY from nginx to the
    # app container. `if` here carries ONLY a `return` — the safe, documented form.
    location ~ ^/app/(?<app_pid>[^/]+)/api(?<app_sub>/.*)?$ {
        error_page 418 = @app_ws;
        if ($http_upgrade) { return 418; }

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # WebSocket branch for a deployed app. Routed by the `Upgrade:` header (above),
    # not a dedicated path — so ANY ws route the app exposes (/signal, /ws/chat, …)
    # works, reached over the same /app/<pid>/api/ base as HTTP. The /app/<pid>/api
    # prefix is stripped to the container's root path ($app_sub), mirroring the HTTP
    # proxy's mapping; the app's own ?token=<JWT> query rides through untouched so
    # the app authenticates the socket itself (browsers can't set ws auth headers).
    # nginx and the app containers share app-net, so `app-<pid>` is reachable by name.
    location @app_ws {
        auth_request /_app_ws_authz;
        auth_request_set $ws_upstream $upstream_http_x_app_upstream;

        proxy_pass http://$ws_upstream$app_sub$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets; no buffering so frames flush immediately.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Internal subrequest: resolves <pid> → "container:port" (X-App-Upstream) and
    # enforces the SAME owner(cookie)/public access check as the HTTP proxy. The
    # ORIGINAL request line (path + ?token=) rides X-Original-URI; the fs_app_token
    # cookie is forwarded automatically. 204 = allow, 403 = deny.
    location = /_app_ws_authz {
        internal;
        proxy_pass http://backend_api/api/code/app-ws/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    # Backend health passthrough (handy for external probes)
    location = /health {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- SPA -----------------------------------------------------------------
    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History-mode routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
