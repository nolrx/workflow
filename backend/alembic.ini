# Alembic config for Worksflow.
#
# Run from the ``backend/`` directory (that is what ``npm run db:migrate`` does):
#   cd backend && uv run alembic upgrade head
#
# Schema authority is still ``db.create_all()`` — fresh databases get the full
# current schema. Migrations exist only to patch EXISTING databases incrementally,
# and each is written GUARDED (add-if-missing) so it is safe in any order. See
# ``migrations/env.py`` and ``docs/composable-workflow-schema.md`` §1.2 / §7.
[alembic]
script_location = migrations
# Put the repo root (parent of backend/) on sys.path so ``backend.*`` imports work.
prepend_sys_path = ..
# Versions are timestamp-prefixed; keep a stable separator.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
